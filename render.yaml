services:
  - type: web
    name: cinequote-api
    runtime: python
    rootDir: back
    region: frankfurt
    plan: free
    buildCommand: pip install --upgrade pip && pip install .
    startCommand: python -m scripts.start_production
    healthCheckPath: /health/ready
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: PROXY_SHARED_SECRET
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: AI_PROVIDER
        value: groq
      - key: AUTH_COOKIE_SECURE
        value: true
      - key: AUTH_COOKIE_SAMESITE
        value: strict
      - key: CSRF_ORIGIN_CHECK_ENABLED
        value: true
      - key: TRUST_PROXY_HEADERS
        value: true
      - key: REQUIRE_PROXY_SECRET
        value: true
